[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-grim"
version = "0.2.0"
description = "RCS visualization and headless dataset processing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
  "PySide6>=6.6",
  "scipy>=1.11",
]

[project.optional-dependencies]
memory = ["psutil>=5.9"]
powerpoint = ["pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
grim = "grim_cut_gui:main"
grim-diagnose = "grim_diagnostics:main"
grim-headless = "grim_headless:main"
ppt-image-imprinter = "ppt_image_imprinter:main"

[tool.setuptools]
package-dir = {"" = "GRIM_Revised_2"}
py-modules = [
  "dataset_plot_style",
  "dataset_sidebar",
  "assembly_tree",
  "assembly_workspace",
  "assembly_response_comparison",
  "assembly_interference",
  "feature_assembly_panel",
  "freddy_integration",
  "grim_cut_dataset_mixin",
  "grim_cut_gui",
  "grim_cut_plot_mixin",
  "grim_csv_schema",
  "grim_dataset",
  "grim_diagnostics",
  "grim_headless",
  "grim_palette",
  "grim_theme",
  "grim_widgets",
  "grim_metadata",
  "grim_python",
  "ghost_integration",
  "hpc_remote",
  "isar_artifact",
  "isar_bpde",
  "isar_repeats",
  "ppt_image_imprinter",
  "ppt_plot_data",
  "ppt_report",
  "ppt_workspace",
  "plot_models",
  "ptm_io",
  "read_ss",
  "runs_workspace",
]

[tool.setuptools.packages.find]
where = ["GRIM_Revised_2"]
include = ["plot_modes*"]
