[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-grim"
version = "0.2.0"
description = "RCS visualization and headless dataset processing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
  "PySide6>=6.6",
  "scipy>=1.11",
]

[project.optional-dependencies]
memory = ["psutil>=5.9"]
powerpoint = ["pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
grim = "GRIM_Backend.ui.app:main"
grim-diagnose = "GRIM_Backend.execution.diagnostics:main"
grim-headless = "GRIM_Backend.scripting.cli:main"
ppt-image-imprinter = "GRIM_Backend.reports.image_imprinter:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["GRIM_Backend*"]
exclude = ["GRIM_Backend.tests*", "GRIM_Backend.examples*"]
namespaces = true

[tool.setuptools.package-data]
GRIM_Backend = ["docs/*.md", "ui/assets/*.png", "reports/templates/*.pptx"]
