name: GHOST headless solver qualification
on:
  push:
    paths:
      - 'tools/GHOST/**'
      - '.github/workflows/ghost-headless.yml'
  pull_request:
    paths:
      - 'tools/GHOST/**'
      - '.github/workflows/ghost-headless.yml'
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: python -m pip install -e './tools/GHOST[test]'
      - run: python -m ghost_backend.twod.fmm.native.build
      - run: python tools/GHOST/scripts/check_headless.py
